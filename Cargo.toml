[package]
name = "testez-companion-cli"
version = "0.1.6"
edition = "2021"
license = "MIT"
authors = ["Jack Taylor <j@jackt.io>"]
description = "CLI for TestEZ Companion"
repository = "https://github.com/jacktabscode/testez-companion-cli"
homepage = "https://github.com/jacktabscode/testez-companion-cli"
readme = "README.md"

[dependencies]
axum = "0.7.5"
axum-server = "0.6.0"
clap = { version = "4.5.4", features = ["derive"] }
console = { version = "0.15.8", features = ["ansi-parsing"] }
dashmap = "5.5.3"
inquire = "0.7.4"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.116"
serde_repr = "0.1.19"
tokio = { version = "1.36.0", features = ["full"] }
toml = "0.8.12"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
# Keep 0.13.2 so `gh workflow run "Release" -f tag=v0.1.5` still plans
# against the tagged Cargo.toml (0.32+ refuses a version mismatch).
cargo-dist-version = "0.13.2"
# release.yml is hand-edited for workflow_dispatch + current runners
allow-dirty = ["ci"]
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
	"aarch64-apple-darwin",
	"x86_64-apple-darwin",
	"x86_64-unknown-linux-gnu",
	"x86_64-pc-windows-msvc",
]
# Publish jobs to run in CI
pr-run-mode = "skip"
windows-archive = ".zip"
unix-archive = ".zip"
checksum = "false"

# cargo-dist 0.13.2 defaults to removed GitHub-hosted images
# (macos-12, windows-2019, ubuntu-20.04). Override to current ones.
# macos-15-intel is the hosted Intel replacement for macos-12 so
# x86_64-apple-darwin stays a native build under 0.13.2.
[workspace.metadata.dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2022"
